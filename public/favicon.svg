<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#efe5cd"/>
  <!-- 外枠（朱・少し版ズレ） -->
  <rect x="38" y="36" width="436" height="438" rx="18" fill="none" stroke="#b5493a" stroke-width="13" transform="translate(3 2)"/>
  <!-- 内枠（紺） -->
  <rect x="64" y="62" width="384" height="388" rx="10" fill="none" stroke="#22456e" stroke-width="4.5"/>
  <!-- 上下の題字 -->
  <text x="256" y="118" font-family="Georgia,'Times New Roman',serif" font-size="42" letter-spacing="14" fill="#22456e" text-anchor="middle" font-weight="bold">ANIMA</text>
  <text x="256" y="432" font-family="Georgia,'Times New Roman',serif" font-size="42" letter-spacing="14" fill="#22456e" text-anchor="middle" font-weight="bold">ATLAS</text>
  <!-- 角飾り（朱の菱） -->
  <g fill="#b5493a">
    <path d="M96 96 l10 -10 10 10 -10 10 Z"/>
    <path d="M396 96 l10 -10 10 10 -10 10 Z"/>
    <path d="M96 416 l10 -10 10 10 -10 10 Z"/>
    <path d="M396 416 l10 -10 10 10 -10 10 Z"/>
  </g>
  <!-- 紋章：紺の円板ロータ -->
  <circle cx="256" cy="268" r="92" fill="#22456e"/>
  <circle cx="256" cy="268" r="14" fill="#efe5cd"/>
  <!-- 朱の軌道環（2色目・あえて3pxズレ＝版ズレ） -->
  <g transform="translate(4 3) rotate(-15 256 268)">
    <ellipse cx="256" cy="268" rx="148" ry="56" fill="none" stroke="#b5493a" stroke-width="15"/>
    <circle cx="391" cy="240" r="22" fill="#b5493a"/>
  </g>
</svg>
